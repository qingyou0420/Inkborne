name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Engine smoke (explicit root, pinned non-4567 port)
        run: pnpm --filter @actalk/inkos-studio build && pnpm engine:smoke
      - name: Refuse secrets in workspace
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)|secrets\.json$' | grep -vE '(^|/)\.env\.example$'; then
            echo "tracked env/secrets files are forbidden"
            exit 1
          fi
      - name: Refuse 1.x Next installer leftovers
        run: node scripts/refuse-next-1x.mjs
