# 打 tag vX.Y.Z 或手动 workflow_dispatch → Windows NSIS 安装包 → 该 tag 的 GitHub Release
name: release-win

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签，如 v2.0.0；留空则用 package.json 的 version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "非法 tag: $TAG（需要 vX.Y.Z）"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          DESKTOP="$(node -p "require('./packages/desktop/package.json').version")"
          TAG_VER="${TAG#v}"
          if [ "$TAG_VER" != "$PKG" ] || [ "$PKG" != "$DESKTOP" ]; then
            echo "tag $TAG 与 package.json $PKG / desktop $DESKTOP 不一致，请先改版本再发版"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "asset=Lightbound-Setup-${PKG}.exe" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Build InkOS core + Studio (prebuilt dist, no Vite at pack time)
        run: pnpm build

      - name: Refuse 1.x Next installer leftovers
        shell: bash
        run: node scripts/refuse-next-1x.mjs

      - name: Refuse tracked secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)|secrets\.json$' | grep -vE '(^|/)\.env\.example$'; then
            echo "tracked env/secrets files are forbidden"
            exit 1
          fi

      - run: pnpm test

      - name: Engine smoke (explicit root, pinned non-4567 port)
        run: pnpm engine:smoke

      - name: Probe H1 (Electron node:sqlite FTS5)
        shell: bash
        run: node scripts/probe-h1.mjs --require-electron-fts5

      - name: Assemble engine extraResources
        run: pnpm assemble:engine

      - name: Smoke assembled engine (explicit root, INKOS_DISABLE_VITE_BUILD)
        run: pnpm engine:pack-smoke

      - name: Refuse secrets in engine payload
        shell: bash
        run: node scripts/lib/refuse-secrets.cjs dist-engine

      - name: Build NSIS installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm dist:win:ci

      - name: Confirm branded exe icon and version info
        shell: powershell
        run: |
          if (Test-Path "dist-installer\UNBRANDED.txt") {
            throw "UNBRANDED.txt present - refusing to release an exe without rcedit branding"
          }
          $exe = "dist-installer\win-unpacked\Lightbound.exe"
          if (-not (Test-Path $exe)) {
            throw "missing $exe - rcedit / version-info check needs the unpacked exe"
          }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "Lightbound") {
            throw "ProductName is '$($info.ProductName)', expected Lightbound (signAndEditExecutable/rcedit did not run)"
          }
          if ($info.FileDescription -notmatch "Lightbound") {
            throw "FileDescription is '$($info.FileDescription)', expected Lightbound"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if (-not $icon -or $icon.Width -lt 16) {
            throw "Lightbound.exe has no usable associated icon"
          }
          Write-Host "branded exe ok ProductName=$($info.ProductName) icon=$($icon.Width)x$($icon.Height)"

      - name: Confirm installer artifact
        shell: bash
        run: |
          asset="dist-installer/${{ steps.meta.outputs.asset }}"
          if [ ! -f "$asset" ]; then
            echo "找不到安装包 $asset"
            exit 1
          fi
          if [ ! -f "${asset}.sha256" ]; then
            echo "找不到校验文件 ${asset}.sha256"
            exit 1
          fi
          test -f "dist-installer/Lightbound-Setup-${{ steps.meta.outputs.version }}.exe"
          test -f "dist-installer/Lightbound-Setup-${{ steps.meta.outputs.version }}.exe.sha256"
          test -f "dist-installer/Inkborne-Setup-${{ steps.meta.outputs.version }}.exe"
          test -f "dist-installer/Inkborne-Setup-${{ steps.meta.outputs.version }}.exe.sha256"
          test -f "dist-installer/FantaWriter-Setup-${{ steps.meta.outputs.version }}.exe"
          test -f "dist-installer/FantaWriter-Setup-${{ steps.meta.outputs.version }}.exe.sha256"
          test -f "dist-installer/Fantasy-Writer-Setup-${{ steps.meta.outputs.version }}.exe"
          test -f "dist-installer/Fantasy-Writer-Setup-${{ steps.meta.outputs.version }}.exe.sha256"
          node scripts/lib/refuse-secrets.cjs dist-installer
          echo "installer ok $(wc -c < "$asset") bytes"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-installer/Lightbound-Setup-*.exe
            dist-installer/Lightbound-Setup-*.exe.sha256
            dist-installer/Inkborne-Setup-*.exe
            dist-installer/Inkborne-Setup-*.exe.sha256
            dist-installer/FantaWriter-Setup-*.exe
            dist-installer/FantaWriter-Setup-*.exe.sha256
            dist-installer/Fantasy-Writer-Setup-*.exe
            dist-installer/Fantasy-Writer-Setup-*.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
