appId: com.fantawriter.app
productName: Lightbound
copyright: Copyright © 2026 轻光之集 / Lightbound（原名墨生万象 / Inkborne，更早为幻想作家）. InkOS © upstream authors.
afterPack: ./scripts/after-pack.cjs
electronVersion: 37.10.3
npmRebuild: false
nodeGypRebuild: false
asar: true
directories:
  output: ../../dist-installer
  buildResources: ../../build
files:
  - main.cjs
  - preload.cjs
  - update-panel.html
  - icon.png
  - icon.ico
  - lib/**/*
  - package.json
extraResources:
  - from: ../../dist-engine
    to: engine
    filter:
      - "**/*"
win:
  icon: icon.ico
  legalTrademarks: Lightbound / 轻光之集
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lightbound-Setup-${version}.${ext}
  # Do not set signAndEditExecutable: false — electron-builder then skips rcedit
  # (icon + FileDescription / ProductName). Unsigned builds still skip sign()
  # when CSC_IDENTITY_AUTO_DISCOVERY=false.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 轻光之集 Lightbound
  uninstallDisplayName: 轻光之集 Lightbound
  installerLanguages:
    - zh_CN
    - en_US
  language: "2052"
